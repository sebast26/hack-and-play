openapi: 3.0.3
info:
  title: Orders Service API
  description: Internal Orders Service API
  version: 3.0.0
servers:
  - url: http://localhost:8081
tags:
  - name: orders
  - name: partner
paths:
  /api/v3/orders:
    get:
      tags:
        - orders
        - partner
      summary: List all orders
      description: Returns a list of all orders in the system
      operationId: listOrders
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  total:
                    type: integer
                    description: Total number of orders
  /api/v3/orders/{id}:
    get:
      tags:
        - orders
        - partner
      summary: Get order by ID
      description: Returns a single order by its ID
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Order:
      type: object
      properties:
        order_id:
          type: string
          description: Unique order identifier
        customer_id:
          type: string
          description: Customer identifier
        customer_name:
          type: string
          description: Customer name
        total:
          type: number
          format: double
          description: Order total amount
        currency:
          type: string
          description: Currency code (e.g., USD, EUR)
        status:
          type: string
          enum: [pending, completed, shipped, cancelled]
          description: Order status
        created_at:
          type: string
          format: date-time
          description: Order creation timestamp
      required:
        - order_id
        - customer_id
        - total
        - currency
        - status
        - created_at
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
